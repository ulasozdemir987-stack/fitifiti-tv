name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: fitifiti-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
