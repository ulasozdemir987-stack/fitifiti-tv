name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: fitifiti-tv
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # main'e her push'ta sabit adrese yayınla: https://github.com/<sahip>/fitifiti-tv/releases/download/latest/fitifiti-tv.apk
      # (ozul.com.tr/tv.apk buraya yönlendirir)
      - name: Son sürümü yayınla
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk fitifiti-tv.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "fıtıfıtı TV · son sürüm" --notes "main dalından otomatik derlenen APK. TV'de: Downloader → ozul.com.tr/tv.apk" --latest
          # uygulama içi güncelleme için sürüm bilgisi (ozul.com.tr/tv-version bunu okur)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          notes=$(git log -1 --format=%s | head -c 300)
          jq -n --argjson c "$code" --arg n "$name" --arg notes "$notes" '{versionCode:$c, versionName:$n, notes:$notes}' > version.json
          cat version.json
          # önce APK, sonra sürüm bilgisi: bilgi hiçbir zaman henüz yüklenmemiş bir APK'yı göstermesin
          gh release upload latest fitifiti-tv.apk --clobber
          gh release upload latest version.json --clobber
